stages:
  data_ingestion:
    cmd: python3 src/data_ingestion.py
    deps:
    - src/data_ingestion.py
    outs:
    - data/raw/data.csv
  data_preprocessing:
    cmd: python3 src/data_preprocessing.py
    deps:
    - data/raw/data.csv
    - src/data_preprocessing.py
    outs:
    - data/processed/data.csv
  feature_engineering:
    cmd: python3 src/feature_engineering.py
    deps:
    - data/processed/data.csv
    - params.yaml
    - src/feature_engineering.py
    outs:
    - data/features/scaler.pkl
    - data/features/test.csv
    - data/features/train.csv
  model_building:
    cmd: python3 src/model_building.py
    deps:
    - data/features/train.csv
    - src/model_building.py
    outs:
    - model.pkl
  model_evaluation:
    cmd: python3 src/model_evaluation.py
    deps:
    - data/features/test.csv
    - model.pkl
    - src/model_evaluation.py
    metrics:
    - metrics.json
